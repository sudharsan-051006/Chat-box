{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat | {{ room_name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>

<body class="dark-mode" style="height: 100vh; margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--bg-dark, #0f172a); color: var(--text-main, #f8fafc); overflow: hidden; transition: background 0.3s ease;">

<style>
    :root {
        --accent: #0ea5e9;
        --bg-dark: #0f172a;
        --sidebar-dark: #020617;
        --glass: rgba(30, 41, 59, 0.7);
        --border: rgba(255, 255, 255, 0.08);
        --text-main: #f8fafc;
        --me-bubble: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
    }
    body.light-mode {
        --bg-dark: #f1f5f9;
        --sidebar-dark: #ffffff;
        --glass: rgba(255, 255, 255, 0.85);
        --border: rgba(0, 0, 0, 0.1);
        --text-main: #0f172a;
    }
    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
    body.light-mode ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }
    textarea:focus { outline: none; }
    textarea { scrollbar-width: none; }
</style>

<div style="display: flex; height: 100vh; position: relative; overflow: hidden;">

    <!-- OVERLAY for mobile -->
    <div id="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('show'); document.getElementById('sidebar-overlay').style.display='none';"
        style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(2px);"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" style="width: 270px; min-width: 270px; max-width: 85vw; background: var(--sidebar-dark); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 16px; z-index: 1000; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease; position: relative; overflow-y: auto;">

        <!-- Room label -->
        <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #64748b; margin-bottom: 8px; font-weight: 600;">Current Room</div>
        <div style="font-weight: 700; color: var(--accent); padding: 10px 14px; background: rgba(14,165,233,0.12); border-radius: 10px; margin-bottom: 18px; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ room_name }}</div>

        <!-- Buttons -->
        {% if request.user == room.created_by %}
        <button id="lock-room-btn" data-room="{{ room.name }}"
            style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; background: transparent; color: #f59e0b; text-decoration: none; margin-bottom: 4px; transition: background 0.2s; cursor: pointer; text-align: left;">
            <i class="fa-solid {% if room.is_locked %}fa-lock-open{% else %}fa-lock{% endif %}" style="width: 18px; text-align: center;"></i>
            {% if room.is_locked %} Unlock Room {% else %} Lock Room {% endif %}
        </button>
        {% endif %}

        <a href="/password_change/"
            style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; background: transparent; color: var(--text-main); text-decoration: none; margin-bottom: 4px; transition: background 0.2s;">
            <i class="fa-solid fa-key" style="width: 18px; text-align: center;"></i> Change Password
        </a>

        <button id="clear-cache-btn"
            style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; background: transparent; color: var(--text-main); margin-bottom: 4px; transition: background 0.2s; cursor: pointer; text-align: left;">
            <i class="fa-solid fa-trash-can" style="width: 18px; text-align: center;"></i> Clear Chat
        </button>

        <button id="toggle-theme-btn"
            style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; background: transparent; color: var(--text-main); margin-bottom: 4px; transition: background 0.2s; cursor: pointer; text-align: left;">
            <i class="fa-solid fa-circle-half-stroke" style="width: 18px; text-align: center;"></i> Change Mode
        </button>

        <hr style="border-color: var(--border); margin: 10px 0;">

        <button id="leave-room-btn"
            style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; background: transparent; color: #ef4444; margin-bottom: 4px; transition: background 0.2s; cursor: pointer; text-align: left;">
            <i class="fa-solid fa-person-walking-arrow-right" style="width: 18px; text-align: center;"></i> Leave Room
        </button>

        <a href="{% url 'logout' %}"
            style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border-radius: 10px; font-size: 14px; border: 1px solid transparent; background: transparent; color: var(--text-main); text-decoration: none; margin-bottom: 4px; transition: background 0.2s;">
            <i class="fa-solid fa-right-from-bracket" style="width: 18px; text-align: center;"></i> Logout
        </a>

        <hr style="border-color: var(--border); margin: 10px 0;">

        <!-- Online users -->
        <div id="online-users-title" style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #64748b; margin-bottom: 10px; font-weight: 600;">Online Users (0)</div>

        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
            <button id="enable-all" class="btn btn-sm btn-success" style="flex: 1; font-size: 11px; padding: 5px 8px;">Enable All</button>
            <button id="disable-all" class="btn btn-sm btn-danger" style="flex: 1; font-size: 11px; padding: 5px 8px;">Disable All</button>
        </div>

        <div class="user-list-container" id="online-users" style="flex: 1; overflow-y: auto;"></div>
    </aside>

    <!-- CHAT AREA -->
    <main style="flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg-dark);">

        <!-- Header -->
        <header id="chat-header" style="padding: 14px 20px; background: var(--glass); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 15px; flex-shrink: 0; min-height: 60px;">
            <button id="menu-btn"
                style="display: none; background: transparent; border: 1px solid var(--border); color: var(--text-main); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; flex-shrink: 0; font-size: 16px;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">
                {{ room_name }} {% if room.is_locked %} 🔒 {% endif %}
            </span>
            <div id="ws-status" title="Connecting..."
                style="width: 9px; height: 9px; border-radius: 50%; background: #eab308; flex-shrink: 0; transition: background 0.3s;"></div>
        </header>

        <!-- Messages -->
        <div class="chat-body" style="flex: 1; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth;">
            <div id="chat-messages" style="max-width: 820px; margin: auto; display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- Input -->
<div id="chat-input-wrapper" style="
    position: sticky;
    bottom: 0;
    padding: 10px 12px calc(100px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg-dark) 80%, transparent);
    flex-shrink: 0;
    z-index: 100;
">
    <form id="chat-form"
        style="
            max-width: 820px;
            margin: auto;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 10px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 8px 24px -4px rgba(0,0,0,0.25);
        ">
        
        {% csrf_token %}

        <textarea
            id="chat-message-input"
            rows="1"
            placeholder="Type a message..."
            style="
                flex: 1;
                background: transparent;
                border: none;
                color: var(--text-main);
                resize: none;
                outline: none;
                padding: 8px 4px;
                font-size: 15px;
                line-height: 1.5;
                max-height: 120px;
                font-family: inherit;
                overflow-y: auto;
            "
        ></textarea>

        <button
            type="submit"
            style="
                background: var(--accent);
                border: none;
                color: white;
                width: 42px;
                height: 42px;
                border-radius: 12px;
                cursor: pointer;
                font-size: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: transform 0.15s ease, opacity 0.2s ease;
            "
        >
            <i class="fa-solid fa-paper-plane"></i>
        </button>

    </form>
</div>
    </main>
</div>

<!-- Responsive sidebar styles -->
<style>
    @media (max-width: 900px) {
        .sidebar {
            position: fixed !important;
            left: 0 !important;
            top: 0 !important;
            height: 100vh !important;
            transform: translateX(-110%) !important;
            box-shadow: none !important;
        }
        .sidebar.show {
            transform: translateX(0) !important;
            box-shadow: 10px 0 40px rgba(0,0,0,0.35) !important;
        }
        #menu-btn { display: flex !important; align-items: center; justify-content: center; }
    }

    .sidebar button:hover, .sidebar a:hover {
        background: rgba(255,255,255,0.06) !important;
        border-color: var(--border) !important;
    }
    body.light-mode .sidebar button:hover, body.light-mode .sidebar a:hover {
        background: rgba(0,0,0,0.05) !important;
    }

    .send-btn:active { transform: scale(0.9) !important; }

    #chat-messages .message-me { align-self: flex-end; background: var(--me-bubble, linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%)); color: white; border-radius: 18px; border-bottom-right-radius: 5px; padding: 11px 16px; font-size: 15px; max-width: 75%; line-height: 1.5; box-shadow: 0 3px 8px rgba(14,165,233,0.25); word-break: break-word; }
    #chat-messages .message-other { align-self: flex-start; background: var(--glass); border: 1px solid var(--border); border-radius: 18px; border-bottom-left-radius: 5px; padding: 11px 16px; font-size: 15px; max-width: 75%; line-height: 1.5; word-break: break-word; }
    #chat-messages .message-system { align-self: center; font-size: 12px; background: rgba(255,255,255,0.05); padding: 5px 16px; border-radius: 20px; opacity: 0.7; }
    body.light-mode #chat-messages .message-system { background: rgba(0,0,0,0.06); }

    @media (max-width: 600px) {
        #chat-messages .message-me, #chat-messages .message-other { max-width: 88%; font-size: 14px; }

        .sidebar { width: 82vw !important; min-width: 0 !important; max-width: 320px !important; padding: 16px 14px !important; }

        #chat-header { padding: 10px 12px !important; gap: 10px !important; font-size: 14px !important; min-height: 52px !important; }
        #chat-header #menu-btn { width: 34px !important; height: 34px !important; font-size: 14px !important; }

        .chat-body { padding: 14px 10px !important; }

        #chat-input-wrapper { padding: 8px 8px calc(60px + env(safe-area-inset-bottom)) !important; }
        #chat-form { padding: 6px 8px !important; border-radius: 14px !important; gap: 6px !important; }
        /* font-size kept at 16px on the input to prevent iOS Safari auto-zoom on focus */
        #chat-message-input { font-size: 16px !important; padding: 6px 4px !important; }
        #chat-form button[type="submit"] { width: 38px !important; height: 38px !important; font-size: 14px !important; }
    }

    @media (min-width: 901px) and (max-width: 1100px) {
        .sidebar { width: 230px !important; min-width: 230px !important; padding: 18px 12px !important; }
    }

    @media (min-width: 1400px) {
        .sidebar { width: 300px !important; min-width: 300px !important; }
        #chat-messages { max-width: 960px !important; }
        #chat-form { max-width: 960px !important; }
    }

    .user-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 5px; font-size: 13px; }
    body.light-mode .user-item { background: rgba(0,0,0,0.03); }
    .status-dot-green { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 7px; flex-shrink: 0; }

    textarea { scrollbar-width: none; -ms-overflow-style: none; }
    textarea::-webkit-scrollbar { display: none; }

    .chat-container {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#chat-log {
    flex: 1;
    overflow-y: auto;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const roomName = "{{ room_name }}";
    const currentUser = "{{ request.user.username }}";
    const chatMessages = document.getElementById("chat-messages");
    const input = document.getElementById("chat-message-input");
    const wsStatus = document.getElementById("ws-status");

    let visibleUsers = new Set();
    let currentOnlineUsers = [];

    // --- WebSocket Setup ---
    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocol}://${window.location.host}/ws/chat/${encodeURIComponent(roomName)}/`);

    ws.onopen = () => { wsStatus.style.background = "#22c55e"; wsStatus.title = "Connected"; };
    ws.onclose = () => { wsStatus.style.background = "#ef4444"; wsStatus.title = "Disconnected"; };

    /* ================= RENDER & CACHE ================= */
    function renderMessage(data) {
        if (!data || !data.user || !data.message) return;
        if (data.user !== "System" && visibleUsers.size > 0 && !visibleUsers.has(data.user)) return;

        const div = document.createElement("div");
        if (data.user === "System") {
            div.className = "message-system";
            div.textContent = data.message;
        } else {
            const isMe = data.user.trim().toLowerCase() === currentUser.trim().toLowerCase();
            div.className = `message ${isMe ? 'message-me' : 'message-other'}`;
            div.innerHTML = `
                ${!isMe ? `<span style="font-size: 11px; font-weight: 800; opacity: 0.8; margin-bottom: 4px; display: block;">${data.user}</span>` : ''}
                <div>${data.message}</div>
                <div style="font-size: 10px; opacity: 0.6; margin-top: 6px; text-align: right;">${data.time}</div>
            `;
        }
        chatMessages.appendChild(div);
        document.querySelector(".chat-body").scrollTop = document.querySelector(".chat-body").scrollHeight;
    }

    function cacheMessage(data) {
        const key = "chat_" + roomName;
        const msgs = JSON.parse(localStorage.getItem(key) || "[]");
        msgs.push(data);
        localStorage.setItem(key, JSON.stringify(msgs.slice(-200)));
    }

    function loadCachedMessages() {
        chatMessages.innerHTML = "";
        const cached = JSON.parse(localStorage.getItem("chat_" + roomName) || "[]");
        cached.forEach(renderMessage);
    }

    /* ================= WEBSOCKET HANDLER ================= */
    ws.onmessage = (e) => {
        const raw = JSON.parse(e.data);
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

        if (raw.type === "system") {
            const data = { user: "System", message: raw.text, time };
            cacheMessage(data); renderMessage(data);
        } else if (raw.type === "user_list") {
            currentOnlineUsers = raw.users;
            updateUserListUI(raw.users);
        } else if (raw.user && raw.message) {
            const data = { user: raw.user, message: raw.message, time };
            cacheMessage(data); renderMessage(data);
        }
    };

    function updateUserListUI(users) {
        const ul = document.getElementById("online-users");
        const title = document.getElementById("online-users-title");
        title.textContent = `Online Users (${users.length})`;
        ul.innerHTML = users.map(u => {
            const enabled = visibleUsers.size === 0 || visibleUsers.has(u);
            return `
                <div class="user-item">
                    <span><span class="status-dot-green"></span>${u}</span>
                    <button class="btn btn-xs ${enabled ? 'btn-outline-danger' : 'btn-outline-success'}" 
                            style="font-size: 9px; padding: 2px 7px;" onclick="toggleUser('${u}')">
                        ${enabled ? 'Disable' : 'Enable'}
                    </button>
                </div>
            `;
        }).join('');
    }

    window.toggleUser = (u) => {
        if (visibleUsers.size === 0) currentOnlineUsers.forEach(x => visibleUsers.add(x));
        visibleUsers.has(u) ? visibleUsers.delete(u) : visibleUsers.add(u);
        loadCachedMessages();
    };

    /* ================= INTERACTION HANDLERS ================= */
    document.getElementById("chat-form").onsubmit = e => {
        e.preventDefault();
        if (input.value.trim() && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ message: input.value }));
            input.value = "";
        }
    };

    document.getElementById("enable-all").onclick = () => { visibleUsers.clear(); loadCachedMessages(); updateUserListUI(currentOnlineUsers); };
    document.getElementById("disable-all").onclick = () => { visibleUsers.clear(); visibleUsers.add(currentUser); loadCachedMessages(); updateUserListUI(currentOnlineUsers); };
    
    document.getElementById("clear-cache-btn").onclick = () => {
        localStorage.removeItem("chat_" + roomName);
        chatMessages.innerHTML = "";
        renderMessage({ user: "System", message: "🧹 Chat history cleared (local)", time: "" });
    };

    document.getElementById("leave-room-btn").onclick = () => { ws.close(); window.location.href = "/"; };

    document.getElementById("lock-room-btn")?.addEventListener("click", function() {
        fetch(`/room/${roomName}/toggle-lock/`, {
            method: "POST",
            headers: { "X-CSRFToken": "{{ csrf_token }}", "Content-Type": "application/json" },
            body: JSON.stringify({ allowed_users: currentOnlineUsers })
        }).then(() => location.reload());
    });

    // --- Theme Management ---
    const themeBtn = document.getElementById("toggle-theme-btn");
    const applyTheme = (theme) => {
        document.body.className = theme;
        localStorage.setItem("theme", theme);
    };
    themeBtn.onclick = () => applyTheme(document.body.classList.contains("dark-mode") ? "light-mode" : "dark-mode");
    applyTheme(localStorage.getItem("theme") || "dark-mode");

    // --- Mobile Sidebar ---
    const sidebar = document.querySelector(".sidebar");
    const overlay = document.getElementById("sidebar-overlay");
    document.getElementById("menu-btn").onclick = (e) => {
        e.stopPropagation();
        sidebar.classList.toggle("show");
        overlay.style.display = sidebar.classList.contains("show") ? "block" : "none";
    };

    // --- Auto-grow textarea ---
    input.addEventListener("input", function() {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    // --- Send on Enter (Shift+Enter for newline) ---
    input.addEventListener("keydown", function(e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            document.getElementById("chat-form").dispatchEvent(new Event("submit"));
        }
    });

    loadCachedMessages();
});
</script>
</body>
</html>
